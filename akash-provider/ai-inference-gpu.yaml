version: "2.0"

services:
  ai-model:
    image: ollama/ollama:latest
    expose:
      - port: 11434
        as: 11434
        to:
          - global: true

profiles:
  compute:
    ai-service:
      resources:
        cpu:
          units: 4
        memory:
          size: 16Gi
        storage:
          size: 50Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                - model: rtx3090

deployment:
  ai-model:
    ai-service:
      profile: ai-service
      count: 1
